<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karte</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="stil.css">

<div id="huelle">
  <aside id="seite">
    <div class="kopf">Geräte</div>
    <div id="reihen" class="liste"><div class="leer">lädt …</div></div>
    <div class="kopf">Orte</div>
    <div id="orte" class="liste"><div class="leer">–</div></div>
  </aside>

  <main id="haupt">
    <div id="leiste">
      <div id="zeitraum" class="knopfgruppe"></div>
      <div class="dehnen"></div>
      <span id="stand" class="stand"></span>
    </div>
    <div id="karte"></div>
    <div id="schieber" class="versteckt">
      <input type="range" id="zeitregler" min="0" max="0" value="0">
      <span id="zeitmarke" class="stand"></span>
    </div>
  </main>
</div>

<script src="/api/plugins/_bruecke.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
